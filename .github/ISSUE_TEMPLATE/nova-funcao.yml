name: Nova função
description: Propor uma capacidade que ainda não existe no GSDock.
title: "[Nova função] "
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema do usuário
      description: Quem precisa desta função, em qual contexto e por quê?
    validations:
      required: true
  - type: textarea
    id: valor
    attributes:
      label: Valor e resultado esperado
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: Escopo
    validations:
      required: true
  - type: textarea
    id: fora
    attributes:
      label: Fora de escopo
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: validacao
    attributes:
      label: Plano de validação e métricas
    validations:
      required: true
  - type: textarea
    id: riscos
    attributes:
      label: Riscos, dependências, limitações e reversão
    validations:
      required: true
